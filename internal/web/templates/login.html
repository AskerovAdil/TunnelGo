{{define "login.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TunnelGo — Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .card {
            width: min(100%, 24rem);
            padding: 2rem;
            border-radius: 1rem;
            background: #1e293b;
            box-shadow: 0 20px 40px rgba(0,0,0,.3);
        }
        h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
        p { margin: 0 0 1.5rem; color: #94a3b8; }
        label { display: block; margin-bottom: .5rem; font-size: .875rem; }
        input {
            width: 100%;
            padding: .75rem 1rem;
            border: 1px solid #334155;
            border-radius: .5rem;
            background: #0f172a;
            color: #e2e8f0;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            padding: .75rem 1rem;
            border: 0;
            border-radius: .5rem;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            margin-bottom: 1rem;
            padding: .75rem 1rem;
            border-radius: .5rem;
            background: rgba(239,68,68,.15);
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <form class="card" method="POST" action="/login">
        <h1>TunnelGo</h1>
        <p>WireGuard VPN Manager</p>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <label for="password">Master password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
{{end}}
