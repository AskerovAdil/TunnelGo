{{define "home.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TunnelGo</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .wrap {
            max-width: 48rem;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .card {
            padding: 1.5rem;
            border-radius: 1rem;
            background: #1e293b;
        }
        button {
            padding: .5rem 1rem;
            border: 0;
            border-radius: .5rem;
            background: #334155;
            color: #e2e8f0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>TunnelGo</h1>
            <form method="POST" action="/logout">
                <button type="submit">Logout</button>
            </form>
        </header>
        <div class="card">
            <p>You are signed in. Dashboard with VPN clients will be added in the next step.</p>
        </div>
    </div>
</body>
</html>
{{end}}
