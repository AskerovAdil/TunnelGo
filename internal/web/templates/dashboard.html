{{define "dashboard.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TunnelGo</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.5;
        }
        .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .card h2 { margin: 0 0 1rem; font-size: 1.125rem; }
        .row { display: flex; gap: .75rem; flex-wrap: wrap; }
        input[type=text] {
            flex: 1;
            min-width: 12rem;
            padding: .75rem 1rem;
            border: 1px solid #334155;
            border-radius: .5rem;
            background: #0f172a;
            color: #e2e8f0;
        }
        button, .btn {
            padding: .75rem 1rem;
            border: 0;
            border-radius: .5rem;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: .875rem;
        }
        button.secondary, .btn.secondary { background: #334155; }
        button.danger { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: .75rem .5rem;
            text-align: left;
            border-bottom: 1px solid #334155;
            vertical-align: top;
        }
        th { color: #94a3b8; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
        .badge {
            display: inline-block;
            padding: .125rem .5rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 600;
        }
        .badge.online { background: rgba(34,197,94,.15); color: #86efac; }
        .badge.offline { background: rgba(148,163,184,.15); color: #cbd5e1; }
        .muted { color: #94a3b8; font-size: .875rem; }
        .error {
            padding: .75rem 1rem;
            border-radius: .5rem;
            background: rgba(239,68,68,.15);
            color: #fca5a5;
            margin-bottom: 1rem;
        }
        .success {
            padding: .75rem 1rem;
            border-radius: .5rem;
            background: rgba(34,197,94,.15);
            color: #86efac;
            margin-bottom: 1rem;
        }
        textarea {
            width: 100%;
            min-height: 10rem;
            padding: .75rem;
            border: 1px solid #334155;
            border-radius: .5rem;
            background: #0f172a;
            color: #e2e8f0;
            font-family: ui-monospace, monospace;
            font-size: .8125rem;
            margin: .75rem 0;
        }
        .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
        @media (max-width: 720px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr {
                margin-bottom: 1rem;
                border: 1px solid #334155;
                border-radius: .75rem;
                padding: .75rem;
            }
            td {
                border: 0;
                padding: .375rem 0;
            }
            td::before {
                content: attr(data-label);
                display: block;
                color: #94a3b8;
                font-size: .75rem;
                text-transform: uppercase;
                margin-bottom: .125rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>TunnelGo</h1>
            <form method="POST" action="/logout">
                <button type="submit" class="secondary">Logout</button>
            </form>
        </header>

        <div class="card">
            <h2>New client</h2>
            <form class="row"
                  hx-post="/clients"
                  hx-target="#create-result"
                  hx-swap="innerHTML"
                  hx-disabled-elt="button">
                <input type="text" name="name" placeholder="client-name" pattern="[-a-zA-Z0-9_]+" maxlength="64" required title="Letters, digits, _ and - only">
                <button type="submit">Create</button>
            </form>
            <div id="create-result" style="margin-top:1rem"></div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
                <h2 style="margin:0">Clients</h2>
                <span class="muted">auto-refresh 30s</span>
            </div>
            <div id="client-list"
                 hx-get="/partials/clients"
                 hx-trigger="load, every 30s"
                 hx-swap="innerHTML">
                {{template "partials/client_list.html" .}}
            </div>
        </div>
    </div>
</body>
</html>
{{end}}
